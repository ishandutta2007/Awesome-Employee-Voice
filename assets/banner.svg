<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card/Pill Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 0.95; }
    }
    @keyframes waveFloat {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }
    @keyframes barPulse {
      0%, 100% { height: 18px; y: 300px; }
      50% { height: 38px; y: 280px; }
    }
    @keyframes barPulse2 {
      0%, 100% { height: 32px; y: 286px; }
      50% { height: 16px; y: 302px; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .pulse-glow-1 {
      animation: pulseSoft 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-glow-2 {
      animation: pulseSoft 9s ease-in-out infinite reverse;
      transform-origin: 1000px 240px;
    }
    .wave-anim {
      animation: waveFloat 10s ease-in-out infinite;
    }
    .sound-bar-1 { animation: barPulse 1.8s ease-in-out infinite; }
    .sound-bar-2 { animation: barPulse2 2.2s ease-in-out infinite; }
    .sound-bar-3 { animation: barPulse 2.6s ease-in-out infinite; }
    .sound-bar-4 { animation: barPulse2 1.9s ease-in-out infinite; }
    .sound-bar-5 { animation: barPulse 2.4s ease-in-out infinite; }
    .floating-pill {
      animation: floatPill 5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Ambient Glow Spheres (Background) -->
  <circle cx="220" cy="110" r="180" fill="url(#glow1)" class="pulse-glow-1" />
  <circle cx="980" cy="240" r="220" fill="url(#glow2)" class="pulse-glow-2" />

  <!-- Decorative Matrix / Dot Grid -->
  <g opacity="0.12" fill="#94a3b8">
    <circle cx="100" cy="50" r="2" /><circle cx="140" cy="50" r="2" /><circle cx="180" cy="50" r="2" />
    <circle cx="100" cy="80" r="2" /><circle cx="140" cy="80" r="2" /><circle cx="180" cy="80" r="2" />
    <circle cx="1020" cy="60" r="2" /><circle cx="1060" cy="60" r="2" /><circle cx="1100" cy="60" r="2" />
    <circle cx="1020" cy="90" r="2" /><circle cx="1060" cy="90" r="2" /><circle cx="1100" cy="90" r="2" />
  </g>

  <!-- Floating Dynamic Voice / Pulse Soundwave Lines (Lower Decorative Area) -->
  <g class="wave-anim" opacity="0.25">
    <path d="M-50,310 C120,280 240,340 400,305 C560,270 700,330 860,300 C1020,270 1140,320 1280,295" 
          stroke="url(#accentGrad)" stroke-width="3" fill="none" />
    <path d="M-50,325 C140,345 280,295 440,320 C600,345 740,285 900,315 C1060,345 1160,305 1280,325" 
          stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Dynamic Soundwave Frequency Bars (Bottom Right Decorative Accent) -->
  <g fill="url(#accentGrad)" opacity="0.45">
    <rect x="1060" width="4" rx="2" class="sound-bar-1" />
    <rect x="1070" width="4" rx="2" class="sound-bar-2" />
    <rect x="1080" width="4" rx="2" class="sound-bar-3" />
    <rect x="1090" width="4" rx="2" class="sound-bar-4" />
    <rect x="1100" width="4" rx="2" class="sound-bar-5" />
    <rect x="1110" width="4" rx="2" class="sound-bar-2" />
    <rect x="1120" width="4" rx="2" class="sound-bar-1" />
  </g>

  <!-- Subtle Ambient Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g class="floating-pill">
    <rect x="80" y="44" width="232" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.2" filter="url(#pillGlow)" />
    <circle cx="98" cy="60" r="5" fill="#10b981" />
    <text x="112" y="66" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- MAIN FOREGROUND TITLE -->
  <text x="80" y="132" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Awesome Employee Voice
  </text>

  <!-- SUBTITLE / DESCRIPTION -->
  <text x="80" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
    The Definitive Guide to Employee Engagement Surveys, Sentiment NLP &amp; Continuous Feedback Platforms
  </text>

  <!-- METRIC BADGE PILLS (Foreground Cards) -->
  <g transform="translate(80, 212)">
    <!-- Pill 1 -->
    <g>
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <text x="16" y="26" fill="#38bdf8" font-size="16">📊</text>
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Enterprise SaaS Pricing</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(236, 0)">
      <rect x="0" y="0" width="224" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <text x="16" y="26" fill="#ec4899" font-size="16">🧠</text>
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Sentiment &amp; NLP Analytics</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(476, 0)">
      <rect x="0" y="0" width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <text x="16" y="26" fill="#10b981" font-size="16">⚡</text>
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open-Source Alternatives</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(702, 0)">
      <rect x="0" y="0" width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <text x="16" y="26" fill="#f59e0b" font-size="16">🎯</text>
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Pulse Surveys &amp; eNPS</text>
    </g>
  </g>

  <!-- BOTTOM ACCENT LINE -->
  <rect x="80" y="284" width="280" height="3" rx="1.5" fill="url(#accentGrad)" />
</svg>
